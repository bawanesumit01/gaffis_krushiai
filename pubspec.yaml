name: krushiiai
description: "AI-powered agriculture assistant for Indian farmers"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  speech_to_text: ^7.0.0
  image_picker: ^1.0.7
  permission_handler: ^11.0.1
  vapi: ^0.1.0
  shared_preferences: ^2.2.2
  device_info_plus: ^10.1.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
